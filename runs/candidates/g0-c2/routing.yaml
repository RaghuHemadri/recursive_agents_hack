# EDITABLE by the improver. Maps published benchmarks (scores frozen in frozen/benchmarks.yaml) to the kinds of work
# the team does, how much to trade quality for price, and when to escalate.
jobs:  # fixed jobs of harness roles
  planning:          {tau_bench: 0.4, terminal_bench: 0.3, ifbench: 0.3}       # lead: delegate + definition of done
  tool_exploration:  {bfcl: 0.5, tau_bench: 0.3, ifbench: 0.2}                # scout: many fast exploration calls
  reflection:        {long_context: 0.5, ifbench: 0.5}                         # reflector: read traces, write lessons
  harness_editing:   {swe_bench: 0.5, terminal_bench: 0.3, long_context: 0.2}  # improver: patch harness files
task_jobs:  # generic kinds of work; the lead tags every analyst/verifier delegation with one, per task
  text_to_sql:       {about: "write SQL to count, look up, join or aggregate data in a database",
                      weights: {bird_sql: 0.6, livecodebench: 0.2, terminal_bench: 0.2}}
  numeric_reasoning: {about: "multi-step arithmetic: units, money, percentages, rates, durations",
                      weights: {aime25: 0.5, gpqa: 0.3, mmlu_pro: 0.2}}
  code_generation:   {about: "write a new program or script that must run correctly",
                      weights: {livecodebench: 0.7, swe_bench: 0.3}}
  repo_editing:      {about: "change or debug an existing codebase",
                      weights: {swe_bench: 0.7, terminal_bench: 0.3}}
  agentic_tools:     {about: "long multi-step workflows calling tools or a shell",
                      weights: {terminal_bench: 0.4, tau_bench: 0.4, bfcl: 0.2}}
  expert_knowledge:  {about: "questions needing graduate-level domain knowledge",
                      weights: {gpqa: 0.4, mmlu_pro: 0.3, hle: 0.3}}
  long_document:     {about: "find and extract facts from very long inputs",
                      weights: {long_context: 0.7, ifbench: 0.3}}
  strict_format:     {about: "produce output that must follow exact format or style rules",
                      weights: {ifbench: 0.7, arena_hard: 0.3}}
default_task_job: agentic_tools
roles: {lead: planning, scout: tool_exploration, analyst: task, verifier: task,
        reflector: reflection, improver: harness_editing}
cost_weight: {default: 0.15, tool_exploration: 0.3, reflection: 0.4, harness_editing: 0.05}
prior_strength: 4          # benchmark prior counts as this many observed tasks
verifier_other_family: true  # verifier must come from a different model family than the analyst
escalation: {after_tool_errors: 2, after_repeated_calls: 2}
pins: {}
exclude: []
