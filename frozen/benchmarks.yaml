# Why each benchmark predicts a job (used as default weights in harness/v0/routing.yaml):
#   tau_bench / bfcl     -> multi-turn tool calling (lead, scout)
#   terminal_bench       -> long agentic tool loops (lead, analyst)
#   bird_sql             -> text-to-SQL (analyst on sql_lookup)
#   aime25 / gpqa        -> careful numeric reasoning (analyst on money_arith, verifier)
#   livecodebench / swe  -> writing correct code / editing a repo (analyst, improver)
#   ifbench              -> following a definition of done / output format (lead, reflector)
#   long_context         -> reading long traces (reflector, improver)
