<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>

  <text x="40" y="52" font-size="30" font-weight="700" fill="#0f172a">Groundhog: an agent team that rewrites how it works</text>
  <text x="40" y="82" font-size="17" fill="#475569">…and keeps a change only if it wins on tasks it has never seen</text>

  <!-- 1 Run -->
  <rect x="60" y="120" width="300" height="110" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="80" y="155" font-size="20" font-weight="700" fill="#3730a3">1  Run</text>
  <text x="80" y="183" font-size="16" fill="#1e293b">Nemotron agent team on Crusoe</text>
  <text x="80" y="206" font-size="16" fill="#1e293b">solves training tasks</text>

  <!-- 2 Reflect -->
  <rect x="460" y="120" width="300" height="110" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="155" font-size="20" font-weight="700" fill="#3730a3">2  Reflect</text>
  <text x="480" y="183" font-size="16" fill="#1e293b">Improver reads its failures and</text>
  <text x="480" y="206" font-size="16" fill="#1e293b">rewrites prompts / sub-agents</text>

  <!-- 3 Test -->
  <rect x="460" y="410" width="300" height="110" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="480" y="445" font-size="20" font-weight="700" fill="#92400e">3  Test on unseen tasks</text>
  <text x="480" y="473" font-size="16" fill="#1e293b">harness vN+1 vs vN, same tasks,</text>
  <text x="480" y="496" font-size="16" fill="#1e293b">plus security tests</text>

  <!-- 4 Keep -->
  <rect x="60" y="410" width="300" height="110" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="445" font-size="20" font-weight="700" fill="#166534">4  Keep only if better</text>
  <text x="80" y="473" font-size="16" fill="#1e293b">promote v2 (git commit)</text>
  <text x="80" y="496" font-size="16" fill="#1e293b">or reject + remember why</text>

  <!-- Brain -->
  <rect x="235" y="280" width="290" height="80" rx="40" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="380" y="314" font-size="18" font-weight="700" fill="#9d174d" text-anchor="middle">Shared Brain</text>
  <text x="380" y="340" font-size="15" fill="#1e293b" text-anchor="middle">curated lessons every agent reads</text>

  <!-- loop arrows -->
  <line x1="362" y1="175" x2="456" y2="175" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="409" y="164" font-size="14" fill="#475569" text-anchor="middle">failures</text>
  <line x1="610" y1="232" x2="610" y2="406" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="622" y="300" font-size="14" fill="#475569">candidate</text>
  <text x="622" y="318" font-size="14" fill="#475569">harness vN+1</text>
  <line x1="458" y1="465" x2="364" y2="465" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="411" y="454" font-size="14" fill="#475569" text-anchor="middle">verdict</text>
  <line x1="150" y1="408" x2="150" y2="234" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="70" y="300" font-size="14" fill="#475569">next</text>
  <text x="70" y="318" font-size="14" fill="#475569">generation</text>

  <!-- Locked zone -->
  <rect x="850" y="120" width="310" height="400" rx="16" fill="#0f172a"/>
  <text x="872" y="158" font-size="20" font-weight="700" fill="#ffffff">Locked: it can't edit this</text>
  <line x1="872" y1="174" x2="1138" y2="174" stroke="#334155" stroke-width="1.5"/>
  <text x="872" y="210" font-size="16" fill="#e2e8f0">• Unseen tasks + answers</text>
  <text x="872" y="246" font-size="16" fill="#e2e8f0">• Checker + accept/reject gate</text>
  <text x="872" y="282" font-size="16" fill="#e2e8f0">• Security guardrails</text>
  <text x="872" y="318" font-size="16" fill="#e2e8f0">• Sandbox: no network,</text>
  <text x="886" y="340" font-size="16" fill="#e2e8f0">no secrets, read-only</text>
  <text x="872" y="384" font-size="14" fill="#94a3b8">Self-improvement erodes guardrails</text>
  <text x="872" y="404" font-size="14" fill="#94a3b8">that live inside the agent.</text>
  <text x="872" y="424" font-size="14" fill="#94a3b8">Ours live outside it.</text>
  <line x1="848" y1="465" x2="764" y2="465" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="806" y="454" font-size="14" fill="#475569" text-anchor="middle">scores</text>

  <text x="40" y="590" font-size="17" fill="#334155">Model weights never change. Only the <tspan font-weight="700">harness</tspan> (how the team works) and the <tspan font-weight="700">brain</tspan> (what it knows) evolve.</text>
</svg>
